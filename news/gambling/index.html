<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gambling News - SlotEdge.bet</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎰</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0e27;
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            position: relative;
            padding-top: 70px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(255, 107, 107, 0.3) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 40px 20px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffd700;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            padding: 12px 24px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 50px;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-link:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: rgba(255, 215, 0, 0.5);
            transform: translateX(-5px);
            box-shadow: 0 5px 20px rgba(255, 215, 0, 0.3);
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #ffd700 0%, #ff6b6b 50%, #c62828 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }

        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1.2em;
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .article-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-left: 4px solid #c62828;
            transition: all 0.3s ease;
        }

        .article-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(255, 215, 0, 0.3);
            border-left-color: #ffd700;
        }

        .article-date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .article-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #ffd700;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1em;
            transition: all 0.3s;
        }

        .article-link:hover {
            gap: 15px;
        }

        /* Navigation Bar Styles */
        nav a:hover {
            color: #ffd700 !important;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }
            nav > div {
                flex-direction: column;
                gap: 15px;
            }
            nav > div > div {
                gap: 20px;
            }
            body {
                padding-top: 120px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav style="position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: rgba(10, 14, 39, 0.95); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 215, 0, 0.2); padding: 15px 0;">
        <div style="max-width: 1400px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
            <a href="../../index.html" style="font-size: 1.5rem; font-weight: 900; text-decoration: none; color: #ffd700;">
                🎰 Slotedge
            </a>
            <div style="display: flex; gap: 30px; align-items: center;">
                <a href="../../index.html" style="color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 600; transition: all 0.3s;">Home</a>
                <a href="../../free-slots-demo.html" style="color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 600; transition: all 0.3s; display: flex; align-items: center; gap: 8px;">
                    🎮 Free Slots Demo
                </a>
                <a href="../../blog.html" style="color: rgba(255,255,255,0.8); text-decoration: none; font-weight: 600; transition: all 0.3s;">
                    📚 Blog
                </a>
                <a href="../index.html" style="color: #ffd700; text-decoration: none; font-weight: 600; transition: all 0.3s;">
                    📰 News
                </a>
            </div>
        </div>
    </nav>
    
    <div class="container">
        <a href="../" class="back-link">← Back to All News</a>
        
        <header>
            <h1>🎰 Gambling News</h1>
            <p class="subtitle" id="article-count">Loading articles...</p>
        </header>
        
        <div class="articles-grid" id="articles-container">
            <!-- Articles will be dynamically loaded here -->
        </div>
    </div>

    <script>
        // Scan directory for article files and display them
        async function loadArticles() {
            const container = document.getElementById('articles-container');
            const countElement = document.getElementById('article-count');
            
            // For now, manually list articles (your article generation script should update this)
            const articles = [
                { file: 'article_gambling_20251107_000419.html', date: 'November 07, 2025 at 12:04 AM' },
                { file: 'article_gambling_20251106_214342.html', date: 'November 06, 2025 at 09:43 PM' }
            ];
            
            countElement.textContent = `${articles.length} article${articles.length !== 1 ? 's' : ''}`;
            
            container.innerHTML = articles.map(article => `
                <div class="article-card">
                    <div class="article-date">${article.date}</div>
                    <a href="${article.file}" class="article-link">View Article →</a>
                </div>
            `).join('');
        }
        
        loadArticles();
    </script>
</body>
</html>
