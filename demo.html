  <script defer>
    window.addEventListener("DOMContentLoaded", () => {
      const params = new URLSearchParams(window.location.search);
      const slotName = params.get("slot");
      const slot = window.slots.find(s => s.name === slotName);
      const container = document.getElementById("iframe-container");

      if (slot) {
        document.getElementById("slot-title").textContent = slot.name;
        container.innerHTML = `
          <div class="iframe-wrapper">
            <iframe src="${slot.iframe}" width="100%" height="700" frameborder="0" allowfullscreen></iframe>
          </div>
        `;
      } else {
        container.innerHTML = `<p class="error-message">⚠️ Slot not found.</p>`;
      }
    });
  </script>

  <script>
    // Create animated stars to match index.html
    function createStars() {
      const starsContainer = document.getElementById('stars');
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.opacity = Math.random() * 0.5 + 0.3;
        starsContainer.appendChild(star);
      }
    }
    createStars();
  </script>
